<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>මගේ Portfolio එක</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <!-- ඔබේ පින්තූරයේ ලින්ක් එක මෙතන 'src' එකට දාන්න -->
            <img src="https://via.placeholder.com/150" alt="Profile Picture" class="profile-pic">
            <h1>ඔබේ නම මෙතනින් යොදන්න</h1>
            <p class="title">Tech Enthusiast | Freelancer | Creator</p>
        </header>

        <section class="about">
            <h2>මා ගැන</h2>
            <p>ආයුබෝවන්! මම තාක්ෂණයට සහ අලුත් දේවල් නිර්මාණය කරන්න ආස කරන කෙනෙක්. මේ මගේ නිල වෙබ් අඩවියයි. මම අන්තර්ජාලය හරහා නවීන තාක්ෂණික සේවා සපයනවා.</p>
        </section>

        <section class="links">
            <h2>මාව සම්බන්ධ කරගන්න</h2>
            <!-- '#' වෙනුවට ඔබේ සැබෑ ලින්ක්ස් යොදන්න -->
            <a href="#" class="btn" target="_blank">GitHub</a>
            <a href="#" class="btn" target="_blank">LinkedIn</a>
            <a href="#" class="btn" target="_blank">Facebook</a>
            <a href="#" class="btn" target="_blank">Email</a>
        </section>

        <footer>
            <p>&copy; 2026 ඔබේ නම. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
